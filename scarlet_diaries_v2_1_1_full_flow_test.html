<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>The Scarlet Diaries · V2.1.1</title>
<meta name="theme-color" content="#8f1728" />
<style>
:root{--bg:#f7efe7;--bg2:#fffaf3;--card:#fffdf8;--ink:#281318;--muted:#75615c;--line:#ead7ca;--scarlet:#9f172b;--scarlet2:#c83a4b;--gold:#b8893d;--soft:#f4e1d2;--danger:#b91c1c;--ok:#166534;--warn:#a16207;--shadow:0 16px 44px rgba(67,31,21,.14);--radius:24px}
body.night{--bg:#14070d;--bg2:#21101a;--card:#2a1420;--ink:#fff4e8;--muted:#d7bdad;--line:#5b2d3b;--scarlet:#ee5368;--scarlet2:#ff7082;--gold:#e4bd78;--soft:#3a1b2b;--danger:#fb7185;--ok:#86efac;--warn:#facc15;--shadow:0 18px 50px rgba(0,0,0,.42)}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(circle at top,var(--bg2),var(--bg));color:var(--ink);min-height:100vh}.app{max-width:520px;margin:0 auto;min-height:100vh;padding:18px 14px 90px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 12px}.brand h1{font-family:Georgia,serif;font-size:26px;line-height:1;margin:0;color:var(--scarlet)}.brand p{margin:4px 0 0;color:var(--muted);font-size:12px}.version{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 9px;background:rgba(255,255,255,.22)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin:12px 0}.soft{background:var(--soft)}.center{text-align:center}.eyebrow{text-transform:uppercase;letter-spacing:.12em;color:var(--gold);font-size:11px;font-weight:900;margin:0 0 8px}.h2{font-family:Georgia,serif;font-size:28px;margin:0 0 8px}.h3{font-size:18px;margin:0 0 8px}.muted{color:var(--muted);font-size:13px;line-height:1.45}.small{font-size:12px;color:var(--muted)}.dose{font-size:42px;font-weight:950;color:var(--scarlet);line-height:1}.timer{font-size:58px;font-weight:950;color:var(--scarlet);letter-spacing:1px}.grid{display:grid;gap:10px}.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:1fr 1fr 1fr}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.list{display:grid;gap:9px}.item{border:1px solid var(--line);border-radius:18px;padding:12px;background:rgba(255,255,255,.20)}.item b{display:block;margin-bottom:4px}.pill{display:inline-flex;border-radius:999px;border:1px solid var(--line);padding:7px 10px;font-size:12px;color:var(--muted);background:rgba(255,255,255,.22);margin:3px}.alert{border:2px solid var(--danger);background:rgba(185,28,28,.08)}.success{border:2px solid var(--ok);background:rgba(22,101,52,.08)}.warn{border:2px solid var(--warn);background:rgba(161,98,7,.08)}.hr{height:1px;background:var(--line);margin:14px 0}.sticky-total{position:sticky;top:8px;z-index:3}
button{border:none;border-radius:16px;padding:14px 15px;font-size:15px;font-weight:850;cursor:pointer;background:var(--soft);color:var(--ink);min-height:52px}button.primary{background:linear-gradient(135deg,var(--scarlet),var(--scarlet2));color:white}button.gold{background:linear-gradient(135deg,#b8893d,#e7bd72);color:#2a1418}button.danger{background:#fee2e2;color:#991b1b}body.night button.danger{background:#5a1724;color:#ffd5dc}button.ok{background:#dcfce7;color:#166534}body.night button.ok{background:#173823;color:#bbf7d0}button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}button:active{transform:scale(.99)}button.tiny{min-height:34px;padding:7px 10px;border-radius:12px;font-size:12px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg2);color:var(--ink);border-radius:14px;padding:13px;font-size:16px;outline:none}textarea{min-height:115px;resize:vertical}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:850;color:var(--muted);margin:0 0 5px}.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,250,243,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 10px;display:flex;gap:7px;justify-content:center;z-index:10}body.night .nav{background:rgba(19,7,13,.92)}.nav button{font-size:11px;min-height:42px;padding:8px 10px;border-radius:14px}.backbar{margin:4px 0 8px}.food-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.qty{max-width:80px}.selectedFood{display:flex;align-items:center;justify-content:space-between;gap:8px}.kbd{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--soft);padding:2px 6px;border-radius:8px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}.modalbox{width:min(520px,100%);max-height:88vh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:18px;border:1px solid var(--line)}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><h1>The Scarlet Diaries</h1><p>Every drop. Every step. Unstoppable.</p></div><span class="version">V2.1.1</span></header>
<main id="root"></main>
</div>
<nav class="nav" id="nav"></nav>
<script>
const VERSION='V2.1.1';
const STORAGE='scarlet_diaries_v211_state';
const RESUME_GAP=10*60*1000;
const defaultState={role:null,screen:'role',screenData:null,moodDone:false,lastMoodAt:0,lastMoodHistory:{},meal:{mealType:'',selected:[],bg:''},settings:{icr:8,correctionFactor:50,targetGlucose:120,activeInsulinHours:3,doseRounding:1,lantusMorning:20,lantusNight:8,morningStart:'06:00',morningEnd:'10:00',nightStart:'19:00',nightEnd:'22:00'},logs:[],entries:[],timer:null};
let lastHiddenAt=null,timerInterval=null;
let state=load();
function load(){try{return merge(defaultState,JSON.parse(localStorage.getItem(STORAGE)||'{}'))}catch(e){return JSON.parse(JSON.stringify(defaultState))}}
function merge(a,b){const o=Array.isArray(a)?[...a]:{...a}; for(const k in b||{}){o[k]=(a&&typeof a[k]==='object'&&!Array.isArray(a[k])&&b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k]))?merge(a[k],b[k]):b[k]} return o}
function save(){localStorage.setItem(STORAGE,JSON.stringify(state))}
function nowISO(){return new Date().toISOString()}
function esc(s){return String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function log(type,data={}){state.logs.unshift({id:Date.now(),type,at:nowISO(),...data});save()}
function roundDose(n){const r=Number(state.settings.doseRounding||1);return Math.round(Number(n||0)/r)*r}
function isNight(){const h=new Date().getHours();return h>=19||h<6}
function applyTheme(){document.body.classList.toggle('night',isNight())} applyTheme(); setInterval(applyTheme,60000);
function setScreen(screen,data=null){state.screen=screen;state.screenData=data;save();render()}
function backHome(){setScreen('dashboard')}
function resetTest(){if(confirm('Reset test data on this device?')){localStorage.removeItem(STORAGE);state=load();render()}}

const FOODS=[
{cat:'Breakfast Favorites',name:'Oatmeal, cooked',portion:'1/2 cup',carbs:15},{cat:'Breakfast Favorites',name:'Oatmeal, cooked',portion:'1 cup',carbs:30},{cat:'Breakfast Favorites',name:'Powdered full cream milk',portion:'2 tbsp',carbs:8},{cat:'Breakfast Favorites',name:'Toasted sourdough bread',portion:'1 slice',carbs:18},{cat:'Breakfast Favorites',name:'Scrambled egg',portion:'1 egg',carbs:1},{cat:'Breakfast Favorites',name:'Hot cocoa',portion:'1 cup',carbs:22},{cat:'Breakfast Favorites',name:'Champorado',portion:'1 cup',carbs:45},
{cat:'Meal Favorites',name:'Baked chicken',portion:'1 serving',carbs:0},{cat:'Meal Favorites',name:'White rice',portion:'1/2 cup',carbs:22},{cat:'Meal Favorites',name:'White rice',portion:'1 cup',carbs:45},{cat:'Meal Favorites',name:'Spaghetti with meatballs',portion:'1 cup',carbs:40},{cat:'Meal Favorites',name:'Pepperoni pizza',portion:'1 slice',carbs:30},{cat:'Meal Favorites',name:'Hamburger bun',portion:'1 bun',carbs:28},{cat:'Meal Favorites',name:'California roll',portion:'4 pieces',carbs:28},{cat:'Meal Favorites',name:'Gyoza',portion:'4 pieces',carbs:20},{cat:'Meal Favorites',name:'Chicken souvlaki',portion:'1 skewer',carbs:2},{cat:'Meal Favorites',name:'Pita bread',portion:'1 small',carbs:30},{cat:'Meal Favorites',name:'Hummus',portion:'2 tbsp',carbs:5},{cat:'Meal Favorites',name:'Pastitsio',portion:'1 serving',carbs:38},{cat:'Meal Favorites',name:'Tzatziki',portion:'2 tbsp',carbs:2},{cat:'Meal Favorites',name:'Meatballs',portion:'3 pieces',carbs:8},{cat:'Meal Favorites',name:'Adobo',portion:'1 serving',carbs:3},{cat:'Meal Favorites',name:'Sinigang',portion:'1 bowl',carbs:8},{cat:'Meal Favorites',name:'Fried chicken',portion:'1 piece',carbs:8},
{cat:'Snacks / Fast Sugar',name:'Juice box',portion:'1 small box',carbs:15},{cat:'Snacks / Fast Sugar',name:'Glucose tablet',portion:'4 tablets',carbs:16},{cat:'Snacks / Fast Sugar',name:'Regular soda',portion:'1/2 cup',carbs:15},{cat:'Snacks / Fast Sugar',name:'Crackers',portion:'4 pieces',carbs:10},{cat:'Snacks / Fast Sugar',name:'Banana',portion:'1 small',carbs:23},{cat:'Snacks / Fast Sugar',name:'Apple',portion:'1 small',carbs:15}
];
const MOTIVATION=['You can do this one step at a time.','You do not have to do this alone.','Your number is just information.','A high number is not your fault.','A low number means we help your body now.','Small steps count.','Let’s take care of you now.','You are safe to ask for help.','You are not in trouble.','Checking your sugar helps keep you safe.','You are more than your sugar number.','No need to rush. Let’s do this carefully.','You can tell the truth here.','Ask Mom, Dad, or Tita if you feel unsure.','Being safe is the goal.','You are doing a hard thing.','We can fix the next step together.','One check, then one next step.','I’m proud of you for checking in.','You can pause and start again.','Let’s make this moment smaller.','One tiny step is still a step.','You are allowed to need help.','Today does not have to be perfect.','You are learning every day.','You are loved in every number.','We only need the next safe step.','You can be honest here.','You are brave for trying.'];
const FEELINGS={
sad:{msgs:['Sad is not bad. It means something feels heavy.','It’s okay to feel sad. You are not doing anything wrong.','Sad feelings can visit sometimes. We can take care of you while they are here.','A sad feeling is a signal, not a problem.','You don’t have to get rid of sadness right away.'],actions:['Hug your pillow.','Drink some water.','Sit next to someone you trust.','Write one line in Scarlet Entry.','Wrap yourself in a blanket.','Hold your favorite thing.','Draw how the feeling looks.','Say: “I feel sad and I need company.”','Listen to one comforting song.','Choose the next tiny step.']},
scared:{msgs:['Scared is not bad. It means your body wants protection.','It’s okay to feel scared. We can make the moment smaller.','A scared feeling is your body asking for support.','You are not wrong for feeling scared.','Scared can feel big. We only need one small next step.'],actions:['Name 3 things you can see.','Hold your favorite thing.','Put both feet on the floor.','Look for 3 red things near you.','Say: “I need help.”','Stay close to a trusted adult.','Count 5 slow taps on your leg.','Write the scary thought in Scarlet Entry.']},
angry:{msgs:['Angry is not bad. It means something feels too much, unfair, or frustrating.','It’s okay to feel angry. We can help it move safely.','Angry feelings are signals too.','You are allowed to feel angry. We just choose a safe next step.','Angry does not mean you are bad.'],actions:['Hold your pillow tight.','Scribble hard on paper.','Count 10 things in the room.','Stamp your feet 10 times.','Write the angry words in Scarlet Entry.','Tear scrap paper.','Draw the feeling as a shape or color.','Stay near someone you trust.','Say: “I’m angry and I need help.”']},
tired:{msgs:['Tired is not bad. It means your body needs care.','It’s okay to feel tired.','Your body may be asking for rest or help.','Tired is a signal. Let’s check what you need.','You do not have to push through alone.'],actions:['Check your sugar.','Drink some water.','Ask someone to stay with you.','Hold your pillow or blanket.','Go to the next step slowly.','Tell someone: “I feel tired.”','Choose the easiest next step.']},
unsure:{msgs:['That’s okay. Sometimes feelings are mixed.','Not knowing is allowed.','You do not have to name it perfectly.','Sometimes the feeling is blurry. We can still help you.','It’s okay if you’re not sure yet.'],actions:['Check your sugar.','Pick the closest feeling.','Write “I don’t know yet” in Scarlet Entry.','Choose one body clue: weird / heavy / annoyed / tired.','Ask for help.','Pick one small thing to do next.']}
};
function chooseFrom(pool,key,count=1){const hist=(state.lastMoodHistory[key]||[]).slice(-3);let available=pool.filter(x=>!hist.includes(x)); if(available.length<count) available=[...pool]; const out=[]; while(out.length<count&&available.length){const i=Math.floor(Math.random()*available.length); out.push(available.splice(i,1)[0])} state.lastMoodHistory[key]=[...(state.lastMoodHistory[key]||[]),...out].slice(-8); save(); return count===1?out[0]:out}
function randomMotivation(){return MOTIVATION[Math.floor(Math.random()*MOTIVATION.length)]}
function shouldMoodFirst(){if(state.role!=='child')return false; if(!state.moodDone)return true; if(Date.now()-(state.lastMoodAt||0)>RESUME_GAP)return true; return false}
function maybeMoodFirst(){if(shouldMoodFirst())setScreen('mood')}

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')lastHiddenAt=Date.now(); if(document.visibilityState==='visible'&&state.role==='child'&&lastHiddenAt&&Date.now()-lastHiddenAt>RESUME_GAP){state.moodDone=false;save();setScreen('mood')}});

function roleScreen(){return `<section class="card center"><p class="eyebrow">The Scarlet Diaries</p><h2 class="h2">Who is opening the app?</h2><p class="muted">Test build only. This version saves on this device so we can audit the flows.</p><div class="grid"><button class="primary" onclick="login('child')">Amara</button><button class="gold" onclick="login('parent')">Parent / Tita</button></div></section>`}
function login(role){state.role=role;state.moodDone=false;state.screen=role==='child'?'mood':'dashboard';save();render()}
function moodScreen(){const nug=randomMotivation();return `<section class="card center"><p class="eyebrow">How I Feel</p><h2 class="h2">Hi Amara.</h2><p class="muted" style="font-size:17px;color:var(--ink)">${esc(nug)}</p><div class="hr"></div><h3 class="h3">How do you feel right now?</h3><div class="grid two"><button class="ok" onclick="completeMood('good')">Good</button><button onclick="completeMood('okay')">Okay</button><button onclick="completeMood('tired')">Tired</button><button onclick="completeMood('scared')">Scared</button><button onclick="completeMood('sad')">Sad</button><button onclick="completeMood('angry')">Angry</button></div><button class="ghost" style="margin-top:10px;width:100%" onclick="completeMood('unsure')">I don’t know</button></section>`}
function completeMood(mood){state.moodDone=true;state.lastMoodAt=Date.now();log('Mood Check-In',{mood});save(); if(mood==='good'||mood==='okay')setScreen('feelingGood',{mood}); else setScreen('feelingSupport',{mood})}
function feelingGood(){const mood=state.screenData?.mood||'okay';return `<section class="card center"><p class="eyebrow">How I Feel</p><h2 class="h2">${mood==='good'?'I’m glad you feel good.':'Okay is enough.'}</h2><p class="muted">Let’s do the next safe step.</p><div class="grid"><button class="primary" onclick="setScreen('dashboard')">Go to dashboard</button><button onclick="setScreen('beforeEat')">Before I Eat</button><button onclick="setScreen('highSugar')">Check sugar</button></div></section>`}
function feelingSupport(){const mood=state.screenData?.mood||'sad';const f=FEELINGS[mood]||FEELINGS.unsure;const msg=chooseFrom(f.msgs,mood+':msg',1);const acts=chooseFrom(f.actions,mood+':acts',3);return `<section class="card"><p class="eyebrow">How I Feel</p><h2 class="h2">${esc(mood[0].toUpperCase()+mood.slice(1))}</h2><p class="muted" style="font-size:16px;color:var(--ink)">${esc(msg)}</p><div class="item"><b>Feelings are not good or bad.</b><span class="small">They are messages from your heart and body. Let’s listen, then choose one safe next step.</span></div><h3 class="h3">Choose one for right now:</h3><div class="grid">${acts.map(a=>`<button onclick="log('Feeling Support',{mood:'${mood}',action:'${esc(a)}'});setScreen('dashboard')">${esc(a)}</button>`).join('')}<button class="primary" onclick="setScreen('scarletEntry',{fromMood:'${mood}'})">Open Scarlet Entry</button><button class="danger" onclick="help()">I need help</button><button class="ghost" onclick="setScreen('dashboard')">Go to dashboard</button></div></section>`}
function dashboard(){return `<section class="card"><p class="eyebrow">Dashboard</p><h2 class="h2">What do you need now?</h2><div class="grid"><button class="primary" onclick="setScreen('beforeEat')">Before I Eat</button><button class="danger" onclick="setScreen('lowSugar')">My Sugar is Low</button><button onclick="setScreen('highSugar')">My Sugar is High</button><button class="gold" onclick="setScreen('lantus')">My Lantus</button><button onclick="setScreen('scarletEntry')">Scarlet Entry</button><button onclick="setScreen('scarletPages')">Scarlet Pages</button></div></section><section class="card soft"><p class="eyebrow">Quick Safety</p><p class="muted">Apidra and Lantus are separate. If you are unsure, ask Mom, Dad, or Tita.</p></section>`}
function beforeEat(){const m=state.meal;const total=mealCarbs();const foodDose=roundDose(total/state.settings.icr);return `${backBtn()}<section class="card"><p class="eyebrow">Before I Eat</p><h2 class="h2">First, what meal is this?</h2><div class="grid two"><button class="${m.mealType==='Breakfast'?'primary':''}" onclick="setMealType('Breakfast')">Breakfast</button><button class="${m.mealType==='Lunch'?'primary':''}" onclick="setMealType('Lunch')">Lunch</button><button class="${m.mealType==='Dinner'?'primary':''}" onclick="setMealType('Dinner')">Dinner</button><button class="${m.mealType==='Snack'?'primary':''}" onclick="setMealType('Snack')">Snack</button></div><div class="field"><label>Glucose mg/dL</label><input id="mealBg" type="number" inputmode="decimal" value="${esc(m.bg)}" oninput="state.meal.bg=this.value;save();updateMealEstimate()"></div><div class="item"><b>Using parent-set ICR</b><span class="small">ICR — Insulin-to-Carbohydrate Ratio: 1 unit Apidra covers ${state.settings.icr}g carbs.</span></div></section><section class="card"><p class="eyebrow">Food Library</p><h2 class="h2">Add food</h2><div class="field"><label>Search food</label><input id="foodSearch" placeholder="Type oatmeal, rice, pizza..." oninput="renderFoodList()"></div><div class="field"><label>Category</label><select id="foodCat" onchange="renderFoodList()"><option>All</option>${[...new Set(FOODS.map(f=>f.cat))].map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div id="foodList" class="list"></div></section><section class="card sticky-total"><p class="eyebrow">Selected Food</p><div id="selectedFood">${selectedFoodHtml()}</div><div class="hr"></div><div id="mealEstimate">${mealEstimateHtml()}</div></section>`}
function setMealType(t){state.meal.mealType=t;save();render()}
function mealCarbs(){return state.meal.selected.reduce((s,x)=>s+(Number(x.carbs)||0)*(Number(x.qty)||1),0)}
function selectedFoodHtml(){if(!state.meal.selected.length)return '<p class="muted">No food added yet. Add from the library so she does not have to memorize grams.</p>';return `<div class="list">${state.meal.selected.map((x,i)=>`<div class="item selectedFood"><div><b>${esc(x.name)}</b><span class="small">${esc(x.portion)} · ${x.carbs}g × ${x.qty} = ${x.carbs*x.qty}g</span></div><button class="tiny danger" onclick="removeFood(${i})">Remove</button></div>`).join('')}</div>`}
function mealEstimateHtml(){const bg=Number(state.meal.bg||0),carbs=mealCarbs(),food=roundDose(carbs/state.settings.icr),corr=roundDose(Math.max(0,(bg-state.settings.targetGlucose)/state.settings.correctionFactor)),total=roundDose(food+corr);return `<h2 class="h2">Estimated Apidra</h2><div class="grid three"><div><span class="small">Food</span><div class="dose">${food}</div></div><div><span class="small">Correction</span><div class="dose">${corr}</div></div><div><span class="small">Total</span><div class="dose">${total}</div></div></div><p class="muted">Food carbs: ${carbs}g. Target glucose: ${state.settings.targetGlucose} mg/dL.</p><div class="grid"><button class="primary" onclick="reviewMealDose()">Ask adult to check</button><button class="ghost" onclick="clearMeal()">Clear meal</button></div>`}
function updateMealEstimate(){const a=document.getElementById('mealEstimate');if(a)a.innerHTML=mealEstimateHtml()}
function renderFoodList(){const q=(document.getElementById('foodSearch')?.value||'').toLowerCase();const cat=document.getElementById('foodCat')?.value||'All';const list=FOODS.filter(f=>(cat==='All'||f.cat===cat)&&(!q||f.name.toLowerCase().includes(q)||f.cat.toLowerCase().includes(q))).slice(0,30);document.getElementById('foodList').innerHTML=list.map((f,i)=>`<div class="item food-row"><div><b>${esc(f.name)}</b><span class="small">${esc(f.cat)} · ${esc(f.portion)} · <b>${f.carbs}g carbs</b></span></div><button class="tiny primary" onclick="addFoodByName('${esc(f.name)}','${esc(f.portion)}',${f.carbs})">Add</button></div>`).join('')||'<p class="muted">No food found.</p>'}
function addFoodByName(name,portion,carbs){state.meal.selected.push({name,portion,carbs,qty:1});save();render()}
function removeFood(i){state.meal.selected.splice(i,1);save();render()}
function clearMeal(){state.meal={mealType:'',selected:[],bg:''};save();render()}
function reviewMealDose(){if(!state.meal.mealType)return alert('Choose meal first.'); if(!Number(state.meal.bg))return alert('Enter glucose first.'); if(!state.meal.selected.length)return alert('Add food from the library first.'); const bg=Number(state.meal.bg),carbs=mealCarbs(),food=roundDose(carbs/state.settings.icr),corr=roundDose(Math.max(0,(bg-state.settings.targetGlucose)/state.settings.correctionFactor)),total=roundDose(food+corr);setScreen('mealReview',{bg,carbs,food,corr,total,mealType:state.meal.mealType,items:state.meal.selected})}
function mealReview(){const d=state.screenData;return `${backBtn('beforeEat')}<section class="card"><p class="eyebrow">Adult Check</p><h2 class="h2">Review Apidra</h2><div class="item"><b>${esc(d.mealType)}</b><span class="small">BG ${d.bg} mg/dL · ${d.carbs}g carbs</span></div><div class="grid three"><div><span class="small">Food</span><div class="dose">${d.food}</div></div><div><span class="small">Correction</span><div class="dose">${d.corr}</div></div><div><span class="small">Total</span><div class="dose">${d.total}</div></div></div><p class="muted">Adult must confirm, change, or choose no insulin right now.</p><div class="grid"><button class="primary" onclick="confirmMeal(${d.total},'confirmed')">Confirm dose: ${d.total} units</button><button onclick="changeMealDose()">Change dose</button><button class="ghost" onclick="confirmMeal(0,'no insulin')">No insulin right now</button><button class="danger" onclick="help()">I need help</button></div></section>`}
function changeMealDose(){const dose=prompt('Adult: enter final Apidra dose in units'); if(dose===null)return; const n=Number(dose); if(isNaN(n))return alert('Enter a number.'); confirmMeal(n,'changed by adult')}
function confirmMeal(finalDose,mode){const d=state.screenData;log('Apidra Adult Check',{...d,finalDose,mode}); if(Number(finalDose)>0){startTimer('meal',15*60,'Time to eat, Amara.')} else {clearMeal();setScreen('dashboard')}}
function highSugar(){return `${backBtn()}<section class="card"><p class="eyebrow">My Sugar is High</p><h2 class="h2">First: active insulin check</h2><div class="field"><label>Glucose mg/dL</label><input id="highBg" inputmode="decimal" type="number" placeholder="Enter glucose"></div><div class="grid"><button onclick="highActive(true)">I took Apidra in the last ${state.settings.activeInsulinHours} hours / not sure</button><button class="primary" onclick="highActive(false)">No Apidra in the last ${state.settings.activeInsulinHours} hours</button></div><div id="highResult"></div></section>`}
function highActive(active){const bg=+document.getElementById('highBg').value;if(!bg)return alert('Enter glucose first.'); if(active){document.getElementById('highResult').innerHTML=`<div class="card alert"><b>You may still have active insulin.</b><p>Ask an adult before taking more Apidra.</p><div class="grid"><button class="danger" onclick="help()">Call Mom / Dad / Tita</button><button class="primary" onclick="log('High Sugar',{bg:${bg},activeInsulin:true,adultChecked:true});setScreen('dashboard')">Adult checked / save</button><button class="ghost" onclick="setScreen('dashboard')">Back to dashboard</button></div></div>`;log('High Sugar Started',{bg,activeInsulin:true});return} const corr=roundDose(Math.max(0,(bg-state.settings.targetGlucose)/state.settings.correctionFactor)); document.getElementById('highResult').innerHTML=`<div class="card soft"><p class="eyebrow">Correction estimate</p><p class="dose">${corr} units</p><p class="muted">Uses parent-set correction factor. If you feel sick or very high, ask an adult now.</p><div class="grid"><button class="primary" onclick="log('High Sugar Correction',{bg:${bg},correction:${corr},adultChecked:true});setScreen('dashboard')">Adult checked / save</button><button onclick="changeHighDose(${bg},${corr})">Adult changed dose</button><button class="ghost" onclick="setScreen('dashboard')">Back to dashboard</button></div></div>`}
function changeHighDose(bg,corr){const dose=prompt('Adult: enter final correction dose'); if(dose===null)return; log('High Sugar Correction',{bg,estimate:corr,finalDose:Number(dose),adultChanged:true}); setScreen('dashboard')}
function lowSugar(){return `${backBtn()}<section class="card"><p class="eyebrow">My Sugar is Low</p><h2 class="h2">Help your body now</h2><p class="muted">Use the doctor’s low-sugar plan, then recheck in 15 minutes.</p><div class="grid"><button class="primary" onclick="log('Low Sugar',{action:'Fast sugar taken'});startTimer('low',15*60,'Time to recheck your sugar.')">I took fast sugar</button><button class="danger" onclick="help()">Call Mom / Dad / Tita</button><button class="ghost" onclick="setScreen('dashboard')">Back to dashboard</button></div></section>`}
function lantus(){const h=new Date().getHours();const night=h>=19||h<6;const usual=night?state.settings.lantusNight:state.settings.lantusMorning;const label=night?'Tonight’s Lantus':'Morning Lantus';return `${backBtn()}<section class="card"><p class="eyebrow">My Lantus</p><h2 class="h2">${label}</h2><div class="item success"><b>Usual dose</b><span class="dose">${usual}</span> units</div><div class="field"><label>How many units does the pen show?</label><input id="lantusDose" type="number" inputmode="decimal" placeholder="Enter units"></div><button class="primary" onclick="checkLantus(${night},${usual})">Check Lantus Dose</button><div id="lantusResult"></div></section>`}
function checkLantus(night,usual){const dose=+document.getElementById('lantusDose').value;if(!dose)return alert('Enter the Lantus units first.'); let html='';if(night&&dose===20){html=`<div class="card alert"><h2>Stop. This looks like your morning dose.</h2><p>Your night Lantus is usually ${state.settings.lantusNight} units. Ask Mom, Dad, or Tita before injecting.</p><button class="danger" onclick="help()">Call adult</button><button class="ghost" onclick="setScreen('dashboard')">Back to dashboard</button></div>`}else if(night&&dose>10){html=`<div class="card alert"><h2>Stop. This is above your night guardrail.</h2><p>Night Lantus is usually ${state.settings.lantusNight} units. Adult confirmation required.</p><button class="danger" onclick="help()">Call adult</button><button class="ghost" onclick="setScreen('dashboard')">Back to dashboard</button></div>`}else if(dose!==usual){html=`<div class="card warn"><h2>This is not the usual dose.</h2><p>Usual dose is ${usual} units. Ask an adult to check.</p><button class="primary" onclick="saveLantus(${dose},'adult-confirmed non-usual')">Adult confirmed</button><button class="ghost" onclick="setScreen('lantus')">Go back</button></div>`}else{html=`<div class="card success"><h2>Double check</h2><p>You are about to record: <b>LANTUS — ${night?'NIGHT':'MORNING'} DOSE — ${dose} UNITS</b></p><div class="grid"><button class="primary" onclick="saveLantus(${dose},'usual confirmed')">Yes, ${dose} units</button><button onclick="setScreen('lantus')">No, go back</button><button class="danger" onclick="help()">Call adult</button></div></div>`} document.getElementById('lantusResult').innerHTML=html}
function saveLantus(dose,status){log('Lantus',{dose,status,time:isNight()?'night':'morning'});setScreen('dashboard')}
function startTimer(kind,seconds,message){state.timer={kind,endsAt:Date.now()+seconds*1000,message};save();setScreen('timer')}
function timerScreen(){return `<section class="card center"><p class="eyebrow">Timer</p><h2 class="h2">${state.timer?.kind==='meal'?'Wait before eating':'Recheck timer'}</h2><div id="timerFace" class="timer">15:00</div><p class="muted">${state.timer?.kind==='meal'?'Wait 15 minutes before eating.':'Recheck your sugar when this ends.'}</p><div class="grid"><button class="primary" onclick="timerDoneEarly()">I am done / continue</button><button class="ghost" onclick="cancelTimer()">Cancel timer</button><button class="danger" onclick="help()">I need help</button></div></section>`}
function tick(){clearInterval(timerInterval);if(!state.timer)return;timerInterval=setInterval(()=>{const left=Math.max(0,Math.ceil((state.timer.endsAt-Date.now())/1000));const el=document.getElementById('timerFace');if(el)el.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(left<=0){const kind=state.timer.kind,msg=state.timer.message;clearInterval(timerInterval);playChime();log('Timer Complete',{kind});state.timer=null;save();alert(msg||'Timer done'); if(kind==='meal'){clearMeal();setScreen('dashboard')} else setScreen('lowRecheck')}} ,500)}
function timerDoneEarly(){log('Timer Stopped',{kind:state.timer?.kind});state.timer=null;save();setScreen('dashboard')}
function cancelTimer(){state.timer=null;save();clearInterval(timerInterval);setScreen('dashboard')}
function lowRecheck(){return `${backBtn()}<section class="card"><p class="eyebrow">Low Sugar Recheck</p><h2 class="h2">Time to recheck</h2><div class="field"><label>New glucose mg/dL</label><input id="recheckBg" type="number" inputmode="decimal"></div><div class="grid"><button class="primary" onclick="saveLowRecheck()">Save recheck</button><button class="danger" onclick="help()">I need help</button></div></section>`}
function saveLowRecheck(){const bg=+document.getElementById('recheckBg').value;if(!bg)return alert('Enter new glucose.');log('Low Sugar Recheck',{bg}); if(bg<70){alert('Still low. Use the doctor’s plan again and ask for help.');setScreen('lowSugar')}else setScreen('dashboard')}
function playChime(){try{const AC=window.AudioContext||window.webkitAudioContext;const ctx=new AC();[523,659,784].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(.001,ctx.currentTime+i*.18);g.gain.exponentialRampToValueAtTime(.16,ctx.currentTime+i*.18+.02);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+i*.18+.16);o.start(ctx.currentTime+i*.18);o.stop(ctx.currentTime+i*.18+.18)})}catch(e){}}
function help(){log('Help Requested',{role:state.role});alert('Ask Mom, Dad, or Tita now.')}
function parent(){const s=state.settings;return `${backBtn()}<section class="card"><p class="eyebrow">Parent Dashboard</p><h2 class="h2">Medical Settings</h2><p class="muted">Only change this if Amara’s doctor changed the plan.</p>${field('icr','ICR — Insulin-to-Carbohydrate Ratio','1 unit Apidra covers ___ grams of carbs',s.icr)}${field('correctionFactor','Correction Factor','1 unit Apidra lowers glucose by ___ mg/dL',s.correctionFactor)}${field('targetGlucose','Target Glucose','Aim for ___ mg/dL',s.targetGlucose)}${field('activeInsulinHours','Rapid Insulin Active Time','Apidra may still be active for ___ hours',s.activeInsulinHours)}${field('lantusMorning','Morning Lantus usual dose','units',s.lantusMorning)}${field('lantusNight','Night Lantus usual dose','units',s.lantusNight)}<button class="primary" onclick="saveSettings()">Save Medical Settings</button></section>`}
function field(id,label,hint,val){return `<div class="field"><label>${label}</label><input id="set_${id}" type="number" value="${val}"><p class="small">${hint}</p></div>`}
function saveSettings(){['icr','correctionFactor','targetGlucose','activeInsulinHours','lantusMorning','lantusNight'].forEach(k=>state.settings[k]=+document.getElementById('set_'+k).value||state.settings[k]);log('Settings Updated',{});save();setScreen('dashboard')}
function scarletEntry(){return `${backBtn()}<section class="card"><p class="eyebrow">Scarlet Entry</p><h2 class="h2">Write what you want to remember, release, or say.</h2><textarea id="entryText" placeholder="Dear Scarlet Diaries..."></textarea><button class="primary" onclick="saveEntry()">Save to Scarlet Pages</button></section>`}
function saveEntry(){const t=document.getElementById('entryText').value.trim();if(!t)return alert('Write something first.');state.entries.unshift({id:Date.now(),at:nowISO(),text:t});log('Scarlet Entry',{saved:true});save();setScreen('scarletPages')}
function scarletPages(){return `${backBtn()}<section class="card"><p class="eyebrow">Scarlet Pages</p><h2 class="h2">Your saved entries</h2><div class="list">${state.entries.length?state.entries.map(e=>`<div class="item"><b>${new Date(e.at).toLocaleString()}</b><p>${esc(e.text)}</p></div>`).join(''):'<p class="muted">No Scarlet Entries yet.</p>'}</div></section>`}
function reports(){return `${backBtn()}<section class="card"><p class="eyebrow">Reports</p><h2 class="h2">Safety Log</h2><p class="muted">Test log: mood, food, Apidra, Lantus, high/low sugar, timers, and adult checks.</p><div class="list">${state.logs.length?state.logs.map(l=>`<div class="item"><b>${esc(l.type)}</b><span class="small">${new Date(l.at).toLocaleString()}</span><p class="small">${esc(JSON.stringify(Object.fromEntries(Object.entries(l).filter(([k])=>!['id','type','at'].includes(k)))))}</p></div>`).join(''):'<p class="muted">No logs yet.</p>'}</div></section>`}
function backBtn(target='dashboard'){return `<div class="backbar"><button class="ghost" onclick="setScreen('${target}')">← Back</button></div>`}
function renderNav(){const nav=document.getElementById('nav');if(state.screen==='role'){nav.innerHTML='';return}nav.innerHTML=`<button onclick="setScreen('dashboard')">Home</button><button onclick="setScreen('beforeEat')">Eat</button><button onclick="setScreen('lantus')">Lantus</button><button onclick="setScreen('parent')">Parent</button><button onclick="setScreen('reports')">Reports</button><button onclick="logout()">Exit</button>`}
function logout(){state.role=null;state.screen='role';state.moodDone=false;save();render()}
function render(){applyTheme();const root=document.getElementById('root'); if(state.role==='child'&&state.screen==='dashboard'&&shouldMoodFirst()){state.screen='mood';save()} const views={role:roleScreen,mood:moodScreen,feelingSupport,feelingGood,dashboard,beforeEat,mealReview,highSugar,lowSugar,lowRecheck,lantus,timer:timerScreen,parent,scarletEntry,scarletPages,reports};root.innerHTML=(views[state.screen]||dashboard)();renderNav();if(state.screen==='beforeEat')renderFoodList();if(state.screen==='timer')tick()}
render();
</script>
</body>
</html>
