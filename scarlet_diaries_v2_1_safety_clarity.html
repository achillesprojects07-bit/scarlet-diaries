<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>The Scarlet Diaries · V2.1</title>
  <meta name="theme-color" content="#7f101e" />
  <style>
    :root{
      --bg:#f7efe5;--bg2:#fffaf3;--card:#fffdf8;--ink:#2a1418;--muted:#715d58;--line:#ead9cc;
      --scarlet:#9e182a;--scarlet2:#c83748;--gold:#b8893d;--soft:#f4e2d2;--danger:#b91c1c;--ok:#166534;--blue:#1d4ed8;
      --shadow:0 18px 48px rgba(68,32,22,.16);--radius:24px;
    }
    body.night{
      --bg:#13070d;--bg2:#21101a;--card:#2b1420;--ink:#fff4e8;--muted:#d2b7a5;--line:#5c2b38;
      --scarlet:#e34b61;--scarlet2:#ff6b7b;--gold:#e3ba73;--soft:#3b1b2a;--danger:#fb7185;--ok:#86efac;--blue:#93c5fd;
      --shadow:0 18px 50px rgba(0,0,0,.42);
    }
    *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(circle at top,var(--bg2),var(--bg));color:var(--ink);min-height:100vh} 
    .app{max-width:520px;margin:0 auto;min-height:100vh;padding:18px 14px 88px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 16px}.brand h1{font-family:Georgia,serif;font-size:27px;line-height:1;margin:0;color:var(--scarlet);letter-spacing:.5px}.brand p{margin:4px 0 0;color:var(--muted);font-size:12px}.version{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 9px;background:rgba(255,255,255,.25)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin:12px 0}.soft{background:var(--soft)}.center{text-align:center}.hidden{display:none!important}.eyebrow{text-transform:uppercase;letter-spacing:.12em;color:var(--gold);font-size:11px;font-weight:800;margin:0 0 8px}.h2{font-family:Georgia,serif;font-size:28px;margin:0 0 8px}.h3{font-size:18px;margin:0 0 8px}.muted{color:var(--muted);font-size:13px;line-height:1.45}.big{font-size:40px;font-weight:900;line-height:1}.dose{font-size:44px;font-weight:900;color:var(--scarlet);line-height:1}.grid{display:grid;gap:10px}.grid.two{grid-template-columns:1fr 1fr}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.pill{display:inline-flex;border-radius:999px;border:1px solid var(--line);padding:7px 10px;font-size:12px;color:var(--muted);background:rgba(255,255,255,.25)}
    button{border:none;border-radius:16px;padding:14px 15px;font-size:15px;font-weight:800;cursor:pointer;background:var(--soft);color:var(--ink);min-height:52px}button.primary{background:linear-gradient(135deg,var(--scarlet),var(--scarlet2));color:white}button.gold{background:linear-gradient(135deg,#b8893d,#e5b96c);color:#2a1418}button.danger{background:#fee2e2;color:#991b1b}body.night button.danger{background:#5b1724;color:#ffd2d9}button.ok{background:#dcfce7;color:#166534}body.night button.ok{background:#173823;color:#bbf7d0}button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}button:active{transform:scale(.99)}
    input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg2);color:var(--ink);border-radius:14px;padding:13px;font-size:16px;outline:none}textarea{min-height:110px;resize:vertical}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:0 0 5px}.list{display:grid;gap:9px;margin-top:10px}.item{border:1px solid var(--line);border-radius:18px;padding:12px;background:rgba(255,255,255,.22)}.item b{display:block;margin-bottom:4px}.alert{border:2px solid var(--danger);background:rgba(185,28,28,.08)}.success{border:2px solid var(--ok);background:rgba(22,101,52,.08)}.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,250,243,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 10px;display:flex;gap:8px;justify-content:center}body.night .nav{background:rgba(19,7,13,.92)}.nav button{font-size:11px;min-height:44px;padding:8px 10px;border-radius:14px}.timer{font-size:56px;font-weight:900;text-align:center;color:var(--scarlet);letter-spacing:1px}.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:8px 0}.check span:first-child{color:var(--ok);font-weight:900}.small{font-size:12px;color:var(--muted)}.hr{height:1px;background:var(--line);margin:14px 0}.tabbar{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.tabbar button{white-space:nowrap;min-height:42px;font-size:13px}.selected{outline:3px solid rgba(184,137,61,.35)}
  </style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><h1>The Scarlet Diaries</h1><p>Every drop. Every step. Unstoppable.</p></div>
    <span class="version">V2.1</span>
  </header>
  <main id="root"></main>
</div>
<nav class="nav" id="nav"></nav>
<script>
const VERSION='V2.1';
const STORAGE='scarlet_diaries_v21_state';
const RESUME_GAP=10*60*1000;
let lastHiddenAt=null;
let timer=null, timerEndsAt=null, timerKind='';
const defaultState={role:null,screen:'role',moodDone:false,lastMoodAt:0,lastMoodHistory:{}, settings:{icr:8,correctionFactor:50,targetGlucose:120,activeInsulinHours:3,doseRounding:1,lantusMorning:20,lantusNight:8,morningStart:'06:00',morningEnd:'10:00',nightStart:'19:00',nightEnd:'22:00'}, logs:[], entries:[]};
let state=load();
function load(){try{return {...defaultState,...JSON.parse(localStorage.getItem(STORAGE)||'{}')}}catch(e){return structuredClone(defaultState)}}
function save(){localStorage.setItem(STORAGE,JSON.stringify(state))}
function nowISO(){return new Date().toISOString()}
function roundDose(n){return Math.round(Number(n||0)/state.settings.doseRounding)*state.settings.doseRounding}
function isNight(){const h=new Date().getHours();return h>=19||h<6}
function applyTheme(){document.body.classList.toggle('night',isNight())}
setInterval(applyTheme,60000); applyTheme();
function setScreen(s){state.screen=s;save();render()}
function log(type,data={}){state.logs.unshift({id:Date.now(),type,at:nowISO(),...data});save()}
function esc(s){return String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}

const MOTIVATION=[
 'You can do this one step at a time.','You do not have to do this alone.','Your number is just information.','A high number is not your fault.','A low number means we help your body now.','Small steps count.','Let’s take care of you now.','You are safe to ask for help.','You are not in trouble.','Checking your sugar helps keep you safe.','You are more than your sugar number.','No need to rush. Let’s do this carefully.','You can tell the truth here.','Ask Mom, Dad, or Tita if you feel unsure.','Being safe is the goal.','You are doing a hard thing.','We can fix the next step together.','One check, then one next step.','I’m proud of you for checking in.','You can pause and start again.','Let’s make this moment smaller.','One tiny step is still a step.','You are allowed to need help.','Today does not have to be perfect.','You are learning every day.','You are loved in every number.','We only need the next safe step.','You can be honest here.','You are brave for trying.'
];
const FEELINGS={
 sad:{msgs:['Sad is not bad. It means something feels heavy.','It’s okay to feel sad. You are not doing anything wrong.','Sad feelings can visit sometimes. We can take care of you while they are here.','A sad feeling is a signal, not a problem.','You don’t have to get rid of the sadness right away.'], actions:['Hug your pillow.','Drink some water.','Sit next to someone you trust.','Write one line in Scarlet Entry.','Wrap yourself in a blanket.','Hold your favorite thing.','Draw how the feeling looks.','Say: “I feel sad and I need company.”','Listen to one comforting song.','Rest for a minute and then choose the next step.']},
 scared:{msgs:['Scared is not bad. It means your body wants protection.','It’s okay to feel scared. We can make the moment smaller.','A scared feeling is your body asking for support.','You are not wrong for feeling scared.','Scared can feel big. We only need one small next step.'], actions:['Name 3 things you can see.','Hold your favorite thing.','Put both feet on the floor.','Look for 3 red things near you.','Say: “I need help.”','Stay close to a trusted adult.','Count 5 slow taps on your leg.','Write the scary thought in Scarlet Entry.']},
 angry:{msgs:['Angry is not bad. It means something feels too much, unfair, or frustrating.','It’s okay to feel angry. We can help it move safely.','Angry feelings are signals too.','You are allowed to feel angry. We just choose a safe next step.','Angry does not mean you are bad.'], actions:['Hold your pillow tight.','Scribble hard on paper.','Count 10 things in the room.','Stamp your feet 10 times.','Write the angry words in Scarlet Entry.','Tear scrap paper.','Draw the feeling as a shape or color.','Stay near someone you trust.','Say: “I’m angry and I need help.”']},
 tired:{msgs:['Tired is not bad. It means your body needs care.','It’s okay to feel tired.','Your body may be asking for rest or help.','Tired is a signal. Let’s check what you need.','You do not have to push through alone.'], actions:['Check your sugar.','Drink some water.','Ask someone to stay with you.','Hold your pillow or blanket.','Go to the next step slowly.','Tell someone: “I feel tired.”','Choose the easiest next step.']},
 unsure:{msgs:['That’s okay. Sometimes feelings are mixed.','Not knowing is allowed.','You do not have to name it perfectly.','Sometimes the feeling is blurry. We can still help you.','It’s okay if you’re not sure yet.'], actions:['Check your sugar.','Pick the closest feeling.','Write “I don’t know yet” in Scarlet Entry.','Choose one body clue: weird / heavy / annoyed / tired.','Ask for help.','Pick one small thing to do next.']}
};
function chooseFrom(pool,history=[],count=1){let available=pool.filter(x=>!history.slice(-2).includes(x)); if(available.length<count) available=pool; const picked=[]; while(picked.length<count&&available.length){const i=Math.floor(Math.random()*available.length); picked.push(available.splice(i,1)[0]);} return picked;}
let currentNugget='';
function pickMotivation(){currentNugget=chooseFrom(MOTIVATION,JSON.parse(localStorage.getItem('sd_motivation_hist')||'[]'),1)[0]; let h=JSON.parse(localStorage.getItem('sd_motivation_hist')||'[]');h.push(currentNugget);localStorage.setItem('sd_motivation_hist',JSON.stringify(h.slice(-5)));}

function render(){applyTheme(); const root=document.getElementById('root'); renderNav();
 if(state.screen==='role') return root.innerHTML=roleView();
 if(state.role==='amara' && shouldMoodGate()) return root.innerHTML=moodView();
 const views={dashboard, beforeEat, highSugar, lowSugar, lantus, parent, reports, scarletEntry, scarletPages, timerView};
 root.innerHTML=(views[state.screen]||dashboard)(); bindAfterRender();}
function shouldMoodGate(){return !state.moodDone && state.screen!=='role'}
function maybeMoodOnResume(){if(state.role==='amara'){state.moodDone=false;state.screen='dashboard';save();render();}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden') lastHiddenAt=Date.now(); if(document.visibilityState==='visible'&&lastHiddenAt&&Date.now()-lastHiddenAt>RESUME_GAP) maybeMoodOnResume();});
window.addEventListener('focus',()=>{if(lastHiddenAt&&Date.now()-lastHiddenAt>RESUME_GAP) maybeMoodOnResume();});
function roleView(){return `<section class="card center"><p class="eyebrow">Private & Protected</p><h2 class="h2">Who is opening The Scarlet Diaries?</h2><div class="grid"><button class="primary" onclick="enterRole('amara')">I am Amara</button><button onclick="enterRole('mom')">I am Mom</button><button onclick="enterRole('dad')">I am Dad</button><button onclick="enterRole('tita')">I am Tita</button></div><p class="muted">This test build uses local storage. Connect it to Firebase after approval.</p></section>`}
function enterRole(role){state.role=role;state.screen='dashboard';state.moodDone=false;pickMotivation();save();render()}
function moodView(){if(!currentNugget) pickMotivation(); return `<section class="card center"><p class="eyebrow">How I Feel</p><h2 class="h2">Hi Amara.</h2><p class="h3">${esc(currentNugget)}</p><p class="muted">How do you feel right now?</p><div class="grid two"><button onclick="selectMood('good')">Good</button><button onclick="selectMood('okay')">Okay</button><button onclick="selectMood('tired')">Tired</button><button onclick="selectMood('scared')">Scared</button><button onclick="selectMood('sad')">Sad</button><button onclick="selectMood('angry')">Angry</button><button class="ghost" onclick="selectMood('unsure')">I don’t know</button></div></section>`}
function selectMood(mood){state.selectedMood=mood; state.moodDone=true; state.lastMoodAt=Date.now(); log('Mood Check-In',{mood}); save(); state.screen='feelingSupport'; renderFeelingSupport(mood)}
function renderFeelingSupport(mood){const root=document.getElementById('root'); if(mood==='good'||mood==='okay'){root.innerHTML=`<section class="card center"><p class="eyebrow">How I Feel</p><h2 class="h2">${mood==='good'?'I’m glad you feel good.':'Okay is enough.'}</h2><p class="muted">Let’s do the next safe step.</p><div class="grid"><button class="primary" onclick="setScreen('dashboard')">Go to dashboard</button><button onclick="setScreen('beforeEat')">Before I Eat</button><button onclick="setScreen('highSugar')">Check sugar</button></div></section>`;return}
 const data=FEELINGS[mood]||FEELINGS.unsure; const hist=state.lastMoodHistory[mood]||{msgs:[],actions:[]}; const msg=chooseFrom(data.msgs,hist.msgs,1)[0]; const acts=chooseFrom(data.actions,hist.actions,3); state.lastMoodHistory[mood]={msgs:[...hist.msgs,msg].slice(-4),actions:[...hist.actions,...acts].slice(-8)}; save(); root.innerHTML=`<section class="card"><p class="eyebrow">How I Feel</p><h2 class="h2">${esc(msg)}</h2><p class="muted">Feelings are not good or bad. Some feel nice. Some feel hard. They are messages from your heart and body.</p><div class="hr"></div><h3 class="h3">Choose one for right now:</h3><div class="grid">${acts.map(a=>`<button onclick="log('Feeling Action',{mood:'${esc(mood)}',action:'${esc(a)}'});setScreen('dashboard')">${esc(a)}</button>`).join('')}<button class="primary" onclick="setScreen('dashboard')">Go to dashboard</button><button class="ghost" onclick="setScreen('scarletEntry')">Open Scarlet Entry</button></div></section>`}
function dashboard(){return `<section class="card"><p class="eyebrow">${isNight()?'Good evening':'Today'}</p><h2 class="h2">Hi, ${state.role==='amara'?'Amara':state.role||'there'}.</h2><p class="muted">Choose the next safe step.</p><div class="grid"><button class="primary" onclick="setScreen('beforeEat')">Before I Eat</button><button onclick="setScreen('lowSugar')">My Sugar is Low</button><button onclick="setScreen('highSugar')">My Sugar is High</button><button onclick="setScreen('lantus')">My Lantus</button><button onclick="setScreen('scarletEntry')">Scarlet Entry</button><button onclick="setScreen('scarletPages')">Scarlet Pages</button></div></section>`}
function beforeEat(){return `<section class="card"><p class="eyebrow">Before I Eat</p><h2 class="h2">Apidra estimate</h2><p class="muted">Using parent-set ICR: 1 unit Apidra covers <b>${state.settings.icr}g carbs</b>.</p><div class="field"><label>Glucose mg/dL</label><input id="bg" inputmode="decimal" type="number" placeholder="Example: 220"></div><div class="field"><label>Food carbs in grams</label><input id="carbs" inputmode="decimal" type="number" placeholder="Example: 39"></div><div class="field"><label>Did Amara take Apidra in the last ${state.settings.activeInsulinHours} hours?</label><select id="active"><option value="no">No</option><option value="yes">Yes / not sure</option></select></div><button class="primary" onclick="calcMeal()">Calculate Estimate</button><div id="mealResult"></div></section>`}
function calcMeal(){const bg=+document.getElementById('bg').value, carbs=+document.getElementById('carbs').value, active=document.getElementById('active').value; if(!bg||!carbs)return alert('Enter glucose and carbs first.'); const food=carbs/state.settings.icr; const corr=active==='yes'?0:Math.max(0,(bg-state.settings.targetGlucose)/state.settings.correctionFactor); const total=roundDose(food+corr); document.getElementById('mealResult').innerHTML=`<div class="card soft"><p class="eyebrow">Estimated Apidra</p><div class="list"><div class="item"><b>Food dose</b>${food.toFixed(2)} units</div><div class="item"><b>Correction dose</b>${active==='yes'?'Blocked because active insulin may still be working':corr.toFixed(2)+' units'}</div><div class="item success"><b>Total estimate</b><span class="dose">${total}</span> units</div></div><p class="muted">Ask an adult to check before giving insulin.</p><div class="grid"><button class="primary" onclick="adultConfirmMeal(${bg},${carbs},${food.toFixed(2)},${corr.toFixed(2)},${total})">Adult confirmed dose</button><button onclick="adultChangeMeal(${bg},${carbs})">Adult changed dose</button><button class="ghost" onclick="log('Before Meal',{bg:${bg},carbs:${carbs},action:'No insulin right now'});setScreen('dashboard')">No insulin right now</button><button class="danger" onclick="help()">I need help</button></div></div>`}
function adultChangeMeal(bg,carbs){const dose=prompt('Adult: enter final Apidra dose in units'); if(dose===null)return; adultConfirmMeal(bg,carbs,null,null,+dose,'changed')}
function adultConfirmMeal(bg,carbs,food,corr,total,mode='confirmed'){log('Apidra Confirmed',{bg,carbs,foodDose:food,correctionDose:corr,finalDose:total,mode}); startTimer('meal',15*60,'Time to eat, Amara.');}
function highSugar(){return `<section class="card"><p class="eyebrow">My Sugar is High</p><h2 class="h2">First: active insulin check</h2><div class="field"><label>Glucose mg/dL</label><input id="highBg" inputmode="decimal" type="number"></div><div class="grid"><button onclick="highActive(true)">I took Apidra in the last ${state.settings.activeInsulinHours} hours / not sure</button><button class="primary" onclick="highActive(false)">No Apidra in the last ${state.settings.activeInsulinHours} hours</button></div><div id="highResult"></div></section>`}
function highActive(active){const bg=+document.getElementById('highBg').value;if(!bg)return alert('Enter glucose first.'); if(active){document.getElementById('highResult').innerHTML=`<div class="card alert"><b>You may still have active insulin.</b><p>Ask an adult before taking more Apidra.</p><button class="danger" onclick="help()">Call Mom / Dad / Tita</button></div>`;log('High Sugar',{bg,activeInsulin:true});return} const corr=roundDose(Math.max(0,(bg-state.settings.targetGlucose)/state.settings.correctionFactor)); document.getElementById('highResult').innerHTML=`<div class="card soft"><p class="eyebrow">Correction estimate</p><p class="dose">${corr} units</p><p class="muted">Uses parent-set correction factor. If you feel sick or very high, ask an adult now.</p><button class="primary" onclick="log('High Sugar Correction',{bg,correction:${corr}});setScreen('dashboard')">Adult checked / save</button></div>`}
function lowSugar(){return `<section class="card"><p class="eyebrow">My Sugar is Low</p><h2 class="h2">Help your body now</h2><p class="muted">Take fast sugar using your doctor’s plan, then recheck in 15 minutes.</p><div class="grid"><button class="primary" onclick="log('Low Sugar',{action:'Fast sugar taken'});startTimer('low',15*60,'Time to recheck your sugar.')">I took fast sugar</button><button class="danger" onclick="help()">Call Mom / Dad / Tita</button></div></section>`}
function lantus(){const h=new Date().getHours(); const isN=h>=19||h<6; const usual=isN?state.settings.lantusNight:state.settings.lantusMorning; const label=isN?'Tonight’s Lantus':'Morning Lantus'; return `<section class="card"><p class="eyebrow">My Lantus</p><h2 class="h2">${label}</h2><div class="item success"><b>Usual dose</b><span class="dose">${usual}</span> units</div><div class="field"><label>How many units does the pen show?</label><input id="lantusDose" type="number" inputmode="decimal" placeholder="Enter units"></div><button class="primary" onclick="checkLantus(${isN},${usual})">Check Lantus Dose</button><div id="lantusResult"></div></section>`}
function checkLantus(isN,usual){const dose=+document.getElementById('lantusDose').value;if(!dose)return alert('Enter the Lantus units first.'); let html=''; if(isN&&dose===20){html=`<div class="card alert"><h2>Stop. This looks like your morning dose.</h2><p>Your night Lantus is usually ${state.settings.lantusNight} units. Ask Mom, Dad, or Tita before injecting.</p><button class="danger" onclick="help()">Call adult</button></div>`;}
 else if(isN&&dose>10){html=`<div class="card alert"><h2>Stop. This is above your night guardrail.</h2><p>Night Lantus is usually ${state.settings.lantusNight} units. Adult PIN/confirmation required.</p><button class="danger" onclick="help()">Call adult</button></div>`;}
 else if(dose!==usual){html=`<div class="card alert"><h2>This is not the usual dose.</h2><p>Usual dose is ${usual} units. Ask an adult to check.</p><button class="primary" onclick="saveLantus(${dose},'adult-confirmed changed/non-usual')">Adult confirmed</button></div>`;}
 else{html=`<div class="card success"><h2>Double check</h2><p>You are about to record: <b>LANTUS — ${isN?'NIGHT':'MORNING'} DOSE — ${dose} UNITS</b></p><div class="grid"><button class="primary" onclick="saveLantus(${dose},'usual confirmed')">Yes, ${dose} units</button><button onclick="setScreen('lantus')">No, go back</button><button class="danger" onclick="help()">Call adult</button></div></div>`;}
 document.getElementById('lantusResult').innerHTML=html;}
function saveLantus(dose,status){log('Lantus',{dose,status,time:isNight()?'night':'morning'});setScreen('dashboard')}
function startTimer(kind,seconds,message){timerKind=kind;timerEndsAt=Date.now()+seconds*1000;state.timer={kind,endsAt:timerEndsAt,message};save();setScreen('timerView'); tick();}
function timerView(){return `<section class="card center"><p class="eyebrow">Timer</p><h2 class="h2">${state.timer?.kind==='meal'?'Wait before eating':'Recheck timer'}</h2><div id="timerFace" class="timer">15:00</div><p class="muted">${state.timer?.kind==='meal'?'Wait 15 minutes before eating.':'Recheck your sugar when this ends.'}</p><div class="grid"><button class="ghost" onclick="cancelTimer()">Cancel timer</button><button class="danger" onclick="help()">I need help</button></div></section>`}
function tick(){clearInterval(timer);timer=setInterval(()=>{if(!state.timer)return; const left=Math.max(0,Math.ceil((state.timer.endsAt-Date.now())/1000)); const el=document.getElementById('timerFace'); if(el) el.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0'); if(left<=0){clearInterval(timer); playChime(); alert(state.timer.message||'Timer done'); log('Timer Complete',{kind:state.timer.kind}); state.timer=null;save();setScreen('dashboard')}},500)}
function cancelTimer(){state.timer=null;save();clearInterval(timer);setScreen('dashboard')}
function playChime(){try{const AC=window.AudioContext||window.webkitAudioContext; const ctx=new AC(); [523,659,784].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(0.001,ctx.currentTime+i*.18);g.gain.exponentialRampToValueAtTime(.18,ctx.currentTime+i*.18+.02);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+i*.18+.16);o.start(ctx.currentTime+i*.18);o.stop(ctx.currentTime+i*.18+.18)})}catch(e){}}
function help(){log('Help Requested',{role:state.role});alert('Ask Mom, Dad, or Tita now.');}
function parent(){const s=state.settings;return `<section class="card"><p class="eyebrow">Parent Dashboard</p><h2 class="h2">Medical Settings</h2><p class="muted">Only change this if Amara’s doctor changed the plan.</p>${field('icr','ICR — Insulin-to-Carbohydrate Ratio','1 unit Apidra covers ___ grams of carbs',s.icr)}${field('correctionFactor','Correction Factor','1 unit Apidra lowers glucose by ___ mg/dL',s.correctionFactor)}${field('targetGlucose','Target Glucose','Aim for ___ mg/dL',s.targetGlucose)}${field('activeInsulinHours','Rapid Insulin Active Time','Apidra may still be active for ___ hours',s.activeInsulinHours)}${field('lantusMorning','Morning Lantus usual dose','units',s.lantusMorning)}${field('lantusNight','Night Lantus usual dose','units',s.lantusNight)}<button class="primary" onclick="saveSettings()">Save Medical Settings</button></section>`}
function field(id,label,hint,val){return `<div class="field"><label>${label}</label><input id="set_${id}" type="number" value="${val}"><p class="small">${hint}</p></div>`}
function saveSettings(){['icr','correctionFactor','targetGlucose','activeInsulinHours','lantusMorning','lantusNight'].forEach(k=>state.settings[k]=+document.getElementById('set_'+k).value||state.settings[k]);log('Settings Updated',{});save();setScreen('dashboard')}
function scarletEntry(){return `<section class="card"><p class="eyebrow">Scarlet Entry</p><h2 class="h2">Write what you want to remember, release, or say.</h2><textarea id="entryText" placeholder="Dear Scarlet Diaries..."></textarea><button class="primary" onclick="saveEntry()">Save to Scarlet Pages</button></section>`}
function saveEntry(){const t=document.getElementById('entryText').value.trim();if(!t)return alert('Write something first.');state.entries.unshift({id:Date.now(),at:nowISO(),text:t});log('Scarlet Entry',{saved:true});save();setScreen('scarletPages')}
function scarletPages(){return `<section class="card"><p class="eyebrow">Scarlet Pages</p><h2 class="h2">Your saved entries</h2><div class="list">${state.entries.length?state.entries.map(e=>`<div class="item"><b>${new Date(e.at).toLocaleString()}</b><p>${esc(e.text)}</p></div>`).join(''):'<p class="muted">No Scarlet Entries yet.</p>'}</div></section>`}
function reports(){return `<section class="card"><p class="eyebrow">Reports</p><h2 class="h2">Safety Log</h2><div class="list">${state.logs.length?state.logs.map(l=>`<div class="item"><b>${esc(l.type)}</b><span class="small">${new Date(l.at).toLocaleString()}</span><p class="small">${esc(JSON.stringify(Object.fromEntries(Object.entries(l).filter(([k])=>!['id','type','at'].includes(k)))))}</p></div>`).join(''):'<p class="muted">No logs yet.</p>'}</div></section>`}
function renderNav(){const nav=document.getElementById('nav'); if(state.screen==='role'){nav.innerHTML='';return} nav.innerHTML=`<button onclick="setScreen('dashboard')">Home</button><button onclick="setScreen('beforeEat')">Eat</button><button onclick="setScreen('lantus')">Lantus</button><button onclick="setScreen('parent')">Parent</button><button onclick="setScreen('reports')">Reports</button><button onclick="logout()">Exit</button>`}
function logout(){state.role=null;state.screen='role';state.moodDone=false;save();render()}
function bindAfterRender(){if(state.timer) tick()}
render();
</script>
</body>
</html>
