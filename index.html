<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>The Scarlet Diaries</title>
  <meta name="description" content="The Scarlet Diaries — Every drop. Every page. Unstoppable." />
  <meta name="theme-color" content="#0d0608" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />

  <!-- iOS / iPhone home-screen install support -->
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Scarlet" />
</head>
<body>
  <div id="app" class="app-shell">
    <section class="screen center">
      <div class="app-wrapper">
        <div class="header">
          <div class="scarlet-drop"></div>
          <div class="app-title">The Scarlet <span>Diaries</span></div>
          <div class="divider"></div>
          <div class="tagline">Every drop. Every page. Unstoppable.</div>
          <div class="build-tag">V2.6.10</div>
        </div>
      </div>
    </section>
  </div>
  <script type="module" src="app.js"></script>
  <script>
    // Register the service worker so the app is installable + works offline.
    // Relative path keeps the scope correct on GitHub Pages subpaths.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js")
          .catch(err => console.warn("Service worker registration failed:", err));
      });
    }
  </script>
</body>
</html>
