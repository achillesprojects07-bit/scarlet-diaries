<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>The Scarlet Diaries</title>
  <meta name="description" content="The Scarlet Diaries — Every drop. Every breath. Unstoppable." />
  <meta name="theme-color" content="#0d0608" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <section class="screen center">
      <div class="app-wrapper">
        <div class="header">
          <div class="scarlet-drop"></div>
          <div class="app-title">The Scarlet <span>Diaries</span></div>
          <div class="divider"></div>
          <div class="tagline">Every drop. Every breath. Unstoppable.</div>
          <div class="build-tag">V5.0</div>
        </div>
      </div>
    </section>
  </div>
  <noscript>
    <p style="color:#e8e2dc;text-align:center;padding:24px;font-family:sans-serif">
      The Scarlet Diaries needs JavaScript turned on to work.
    </p>
  </noscript>
  <script type="module" src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(err => console.warn("Offline mode unavailable:", err));
      });
    }
  </script>
</body>
</html>
